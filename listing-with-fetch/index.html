<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carforce listings</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.5; max-width: 60rem; margin: 0 auto; padding: 1rem; }
    form { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; }
    form h2 { width: 100%; margin: 0; }
    label { display: block; font-weight: bold; }
    select, button { font: inherit; padding: 0.4rem; }
    .cards { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .card { border: 1px solid #767676; border-radius: 0.5rem; padding: 1rem; }
    .card h3 { margin-top: 0; }
    .fav[aria-pressed="true"] { background: gold; }

    /* phone  */
    @media (max-width:40em) {
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <p>Carforce</p>
  </header>

  <main>
    <h1>Used cars for sale</h1>

    <form aria-labelledby="filter-heading">
      <h2 id="filter-heading">Filter cars</h2>
      <div>
        <label for="make">Make</label>
        <select id="make" name="make">
          <option value="">Any make</option>
          <option>Honda</option>
          <option>Suzuki</option>
          <option>Toyota</option>
        </select>
      </div>
      <div>
        <label for="price">Maximum price</label>
        <select id="price" name="price">
          <option value="">Any price</option>
          <option value="3000000">Up to PKR 3 million</option>
          <option value="5000000">Up to PKR 5 million</option>
          <option value="8000000">Up to PKR 8 million</option>
        </select>
      </div>
    </form>

    <h2>Results</h2>
    <p id="count" role="status">Loading cars...</p>
    
    <ul class="cards" role="list"></ul>
    <p id="sentinel">Loading more cars...</p>

    <template id="card-template">
      <li class="card">
        <h3></h3>
        <p class="price"></p>
        <p class="info"></p>
        <button class="fav" type="button" aria-pressed="false">Favourite</button>
      </li>
    </template>
  </main>

  <footer>
    <p>Footer</p>
  </footer>

  <script>
    const form = document.querySelector('form');
    const list = document.querySelector('.cards');
    const sentinel = document.getElementById('sentinel');
    const count = document.getElementById('count');
    const template = document.getElementById('card-template');

    let cars = [];
    let loaded = 0;
    let favourites = JSON.parse(localStorage.getItem('favourites')) || [];

    function update() {
      const make = form.make.value;
      const maxPrice = Number(form.price.value) || Infinity;
      let shown = 0;
      for (const card of document.querySelectorAll('.card')) {
        const match = (!make || card.dataset.make === make) && Number(card.dataset.price) <= maxPrice;
        card.hidden = !match;
        if (match) shown++;
        card.querySelector('.fav').setAttribute('aria-pressed', favourites.includes(card.dataset.id));
      }
      count.textContent = shown + (shown === 1 ? ' car' : ' cars');
    }

    form.addEventListener('change', update);

    // favourites
    list.addEventListener('click', (event) => {
      if (!event.target.matches('.fav')) return;
      const id = event.target.closest('.card').dataset.id;
      if (favourites.includes(id)) {
        favourites = favourites.filter((favId) => favId !== id);
      } else {
        favourites.push(id);
      }
      localStorage.setItem('favourites', JSON.stringify(favourites));
      update();
    });

    function addCard(car) {
      const card = template.content.firstElementChild.cloneNode(true);
      card.dataset.id = car.id;
      card.dataset.make = car.make;
      card.dataset.price = car.price;
      card.querySelector('h3').textContent = car.make + ' ' + car.model;
      card.querySelector('.price').textContent = 'PKR ' + car.price.toLocaleString('en-US');
      card.querySelector('.info').textContent = car.year + ', ' + car.km.toLocaleString('en-US') + ' km, ' + car.city;
      list.append(card);
    }

    // infinite scroll
    function loadMore() {
      for (const car of cars.slice(loaded, loaded + 20)) {
        addCard(car);
      }
      loaded += 20;
      update();

      if (loaded >= cars.length) {
        observer.disconnect();
        sentinel.textContent = 'No more cars';
      } else {
        // check again
        observer.unobserve(sentinel);
        observer.observe(sentinel);
      }
    }

    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) loadMore();
    }, { rootMargin: '200px' });

    async function getCars() {
      try {
        const response = await fetch('cars.json');
        if (!response.ok) throw new Error(response.status);
        cars = await response.json();
        loadMore();
      } catch (error) {
        console.log(error);
        count.textContent = 'Error loading cars';
        sentinel.hidden = true;
      }
    }

    getCars();
  </script>
</body>
</html>
